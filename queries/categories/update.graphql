mutation Web_UpdateCategory($input: UpdateCategoryInput!) {
  updateCategory(input: $input) {
    errors {
      message
      code
    }
    category {
      id
      name
      icon
      budgetVariability
      excludeFromBudget
      group {
        id
        type
      }
      rolloverPeriod {
        id
        startMonth
        startingBalance
        type
        frequency
        targetAmount
      }
    }
  }
}
