query Common_SavingsGoals {
  savingsGoals {
    id
    type
    name
    status
    progress
    currentBalance
    targetDate
    targetAmount
    plannedMonthlyContribution
    currentMonthPlannedContributionAmount
    spendingTotal
    netContribution
    estimatedMonthsUntilCompletion
    forecastedCompletionDate
    isSinkingFund
    priority
  }
}
