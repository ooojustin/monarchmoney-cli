name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Format and vet
        run: make lint-base
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
