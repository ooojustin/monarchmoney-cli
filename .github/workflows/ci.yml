name: CI

on:
  push:
    branches: [main, jstn]
  pull_request:
    branches: [main, jstn]

permissions:
  contents: read

jobs:
  ci:
    uses: thedavidweng/cli-workflow-template/.github/workflows/go-ci.yml@main
    with:
      enable-coverage: true
      enable-conventions: true
    secrets: inherit
